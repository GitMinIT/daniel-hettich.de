<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Daniel Hettich — digital business card</title>
    <meta name="description" content="Daniel Hettich — digital business card. Tinkerer, homelab, Linux. Mail & GitHub, served cozy.">
    <link rel="stylesheet" href="/assets/css/style.css">
</head>
<body>
    <div class="desktop" id="desktop">

        <div class="desk-icons" aria-label="Desktop-Verknüpfungen">
            <a class="desk-icon" href="mailto:kontakt@daniel-hettich.de">
                <span class="di-art" aria-hidden="true">✉</span>
                <span class="di-label" data-chrome="icon_mail_label">mail</span>
            </a>
            <a class="desk-icon" href="https://github.com/GitMinIT" target="_blank" rel="noopener">
                <span class="di-art" aria-hidden="true">
                    <svg viewBox="0 0 16 16" width="28" height="28" fill="currentColor" aria-hidden="true">
                        <path d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.05-.13-.36-.91.08-1.9 0 0 .67-.21 2.2.82.64-.18 1.32-.27 2-.27.68 0 1.36.09 2 .27 1.53-1.04 2.2-.82 2.2-.82.44.99.13 1.77.08 1.9.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A7.995 7.995 0 0 0 16 8c0-4.42-3.58-8-8-8z"/>
                    </svg>
                </span>
                <span class="di-label" data-chrome="icon_gh_label">github</span>
            </a>
            <a class="desk-icon" href="/impressum">
                <span class="di-art" aria-hidden="true">§</span>
                <span class="di-label" data-chrome="icon_imp_label">imprint</span>
            </a>
            <a class="desk-icon" href="/datenschutz">
                <span class="di-art" aria-hidden="true">🔒</span>
                <span class="di-label" data-chrome="icon_dat_label">privacy</span>
            </a>
        </div>

        <section class="term-window" id="term-window" aria-label="Terminal">
            <div class="term-titlebar">
                <span class="term-title" data-chrome="window_title">visitor@daniel-home: ~</span>
                <div class="term-controls">
                    <button class="win-btn" id="win-min" type="button" data-chrome-title="win_min" aria-label="minimize">–</button>
                    <button class="win-btn" id="win-max" type="button" data-chrome-title="win_max" aria-label="maximize">▢</button>
                    <button class="win-btn win-close" id="win-close" type="button" data-chrome-title="win_close" aria-label="close">✕</button>
                </div>
            </div>
            <div class="term-body">
                <div class="term-output" id="term-output" aria-live="polite" data-chrome-label="output_aria">
                    <div class="term-lines" id="term-lines"></div>
                </div>
                <div class="term-input-row">
                    <label class="prompt" for="term-input"><span class="p-user"></span>@<span class="p-host"></span>:~$</label>
                    <input id="term-input" class="term-input" type="text" autocomplete="off" autocapitalize="off" spellcheck="false" autofocus>
                </div>
            </div>
        </section>

        <div class="footer">
            <span data-chrome="made"></span>
            <span class="footer-links">
                <a href="/impressum" data-chrome="impressum">imprint</a> · <a href="/datenschutz" data-chrome="datenschutz">privacy</a> · <a href="/datenschutz" id="footer-ai" data-chrome="ai_note" title="Diese Seite wurde mit Unterstützung von KI erstellt">✳</a>
            </span>
        </div>
    </div>

    <nav class="taskbar" aria-label="Taskbar">
        <span class="tb-start">
            <button class="tb-logo" id="tb-logo" type="button" title="gemütlich-os">☕</button>
            <span class="tb-os" data-chrome="taskbar_os">cozy-os</span>
        </span>
        <span class="tb-middle"></span>
        <span class="tb-right">
            <button class="tb-vm" id="vm-toggle" type="button" data-chrome-title="vm_open" title="Windows VM öffnen">
                <span class="win-logo" aria-hidden="true">⊞</span>
            </button>
            <button class="tb-theme" id="theme-toggle" type="button" data-chrome-title="theme_btn" title="light switch">☀</button>
            <button class="tb-lang" data-lang="de" type="button">DE</button>
            <button class="tb-lang" data-lang="en" type="button">EN</button>
            <span class="tb-clock" id="tb-clock">--:--</span>
        </span>
    </nav>

    <script type="module" src="/assets/js/main.js"></script>
</body>
</html>
