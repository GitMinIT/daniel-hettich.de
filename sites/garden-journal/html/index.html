<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gartenjournal - Daniel Hettich</title>
    <link rel="stylesheet" href="/assets/css/style.css">
</head>
<body>
    <div class="app-shell">
        <header class="topbar">
            <div class="brand">
                <div class="brand-mark">✦</div>
                <div class="brand-title">Mein Gemüsegarten</div>
            </div>
            <div class="header-actions">
                <button class="btn">Import</button>
                <button class="btn btn-primary">Sichern</button>
            </div>
        </header>

        <main class="main-content">
            <div id="notifications" class="notification-panel"></div>

            <nav class="tabs">
                <button class="tab active">Beetplanung</button>
                <button class="tab">Pflanzkalender</button>
                <button class="tab">Kulturen</button>
            </nav>

            <!-- Planning Workspace -->
            <section id="workspace-planning" class="workspace">
                <div class="section-heading">
                    <h2>Beetplanung</h2>
                    <p>Verwalte deine Beete und pflanze neue Kulturen.</p>
                </div>

                <div class="form-group">
                    <div class="input-field">
                        <label>Neues Beet</label>
                        <input id="beet-name" placeholder="z.B. Sonnenbeet">
                    </div>
                    <div class="input-field">
                        <label>Breite (m)</label>
                        <input id="beet-width" type="number" step="0.1" value="1.2">
                    </div>
                    <div class="input-field">
                        <label>Länge (m)</label>
                        <input id="beet-length" type="number" step="0.1" value="3.0">
                    </div>
                    <button id="add-beet-btn" class="btn btn-primary">＋ Beet</button>
                </div>

                <hr style="border: 0; border-top: 1px solid #333; margin: 2rem 0;">

                <div class="form-group">
                    <div class="input-field">
                        <label>Beet wählen</label>
                        <select id="target-beet"></select>
                    </div>
                    <div class="input-field">
                        <label>Kultur</label>
                        <select id="target-crop"></select>
                    </div>
                    <div class="input-field">
                        <label>Anzahl</label>
                        <input id="planting-count" type="number" value="1">
                    </div>
                    <div class="input-field">
                        <label>Datum</label>
                        <input id="planting-date" type="date">
                    </div>
                    <button id="submit-planting" class="btn btn-primary">Pflanzen</button>
                </div>

                <div id="beet-list" class="beet-list"></div>
            </section>

            <!-- Calendar Workspace -->
            <section id="workspace-calendar" class="workspace hidden">
                <h2>Pflanzkalender</h2>
                <p>Hier erscheint bald dein interaktiver Zeitplan.</p>
            </section>

            <!-- Crops Workspace -->
            <section id="workspace-crops" class="workspace hidden">
                <div class="section-heading">
                    <h2>Kulturen</h2>
                    <p>Deine bibliothek an Gemüse-Sorten.</p>
                </div>
                <div class="form-group">
                    <div class="input-field">
                        <label>Kulturname</label>
                        <input id="crop-name" placeholder="z.B. Tomate">
                    </div>
                    <div class="input-field">
                        <label>Farbe (Hex)</label>
                        <input id="crop-color" type="color" value="#4CAF50">
                    </div>
                    <button id="add-crop-btn" class="btn btn-primary">＋ Kultur hinzufügen</button>
                </div>
                <div id="crop-list" class="crop-list"></div>
            </section>
        </main>
    </div>
    <script src="/assets/js/main.js"></script>
</body>
</html>
