# HomeGate testing/debugging stack (explicit override — NOT auto-loaded).
#
# This server exists to implement, test and debug this project. Nothing is
# published from here before being verified, so the stack is HTTP-only and
# the site container is exposed directly — no global-proxy, no TLS.
#
# Port plan on this host (each project gets its own direct port):
#   daniel-hettich.de -> 6009   pompui.de -> 6010
#
# Usage (paths in override files resolve against the first compose file's dir):
#   docker compose -f docker-compose.yml -f infrastructure/compose/homegate-testing.yml up -d --build

services:
  # The global-proxy is not part of this HTTP-direct workflow; assigning it
  # to a profile we never activate keeps the base compose file untouched
  # while ensuring `up` here only starts the site container.
  proxy:
    profiles:
      - production-only

  landing-page:
    ports: !override
      - "6009:8080"