# HomeGate testing/debugging stack (explicit override — NOT auto-loaded).
#
# This server is a testing/debugging host, not production. Ports 80/443 are
# occupied by other services here, so global-proxy binds 6009 (http) and
# 6010 (https) instead. TLS certificates are self-signed and generated by
# infrastructure/scripts/gen-selfsigned-certs.sh into secrets/certs/ (git-ignored).
#
# Usage (paths in override files resolve against the first compose file's dir):
#   docker compose -f docker-compose.yml -f infrastructure/compose/homegate-testing.yml up -d --build

services:
  proxy:
    ports: !override
      - "6009:80"
      - "6010:443"
    volumes: !override
      - ./infrastructure/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./infrastructure/nginx/conf.d:/etc/nginx/conf.d:ro
      - ./secrets/certs:/etc/nginx/ssl:ro

  # Placeholders: the git-tracked pompui proxy confs expect these upstream
  # hostnames; nginx refuses to start if they don't resolve. The real
  # containers are defined in the pompui.de project, not here.
  pompui-landing:
    image: nginxinc/nginx-unprivileged:alpine
    container_name: pompui-landing
    networks:
      - web-network
    restart: always

  pompui-garden-journal:
    image: nginxinc/nginx-unprivileged:alpine
    container_name: pompui-garden-journal
    command: >
      /bin/sh -c "sed -i 's/8080/3000/' /etc/nginx/conf.d/default.conf &&
      nginx -g 'daemon off;'"
    networks:
      - web-network
    restart: always