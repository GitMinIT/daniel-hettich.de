services:
  proxy:
    image: nginx:alpine
    container_name: global-proxy
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./infrastructure/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./infrastructure/nginx/conf.d:/etc/nginx/conf.d:ro
      - /etc/letsencrypt:/etc/nginx/ssl:ro
    networks:
      - web-network
    restart: always

  landing-page:
    build: ./sites/landing-page
    container_name: landing-page
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    networks:
      - web-network
    restart: always

networks:
  web-network:
    driver: bridge
